    <!-- ========================================== -->
    <!-- CSS -->
    <!-- ========================================== -->
    <style>
      :root {
        --bg: #0b1220;
        --card: rgba(255, 255, 255, 0.08);
        --border: rgba(255, 255, 255, 0.12);
        --text: rgba(255, 255, 255, 0.92);
        --muted: rgba(255, 255, 255, 0.65);
        --shadow: 0 16px 50px rgba(0, 0, 0, 0.35);
        --radius: 18px;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100dvh;
        color: var(--text);
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans JP", "Hiragino Kaku Gothic ProN", Meiryo, Arial, sans-serif;
        background:
          radial-gradient(900px 600px at 20% 10%, rgba(90, 213, 215, 0.18), transparent 60%),
          radial-gradient(800px 600px at 80% 30%, rgba(170, 120, 255, 0.14), transparent 60%),
          radial-gradient(800px 700px at 50% 100%, rgba(255, 180, 120, 0.10), transparent 60%),
          var(--bg);
      }
      .wrap { max-width: 720px; margin: 0 auto; padding: 32px 18px; display: grid; place-items: center; min-height: 100dvh; }
      .card { width: 100%; padding: 22px; border-radius: var(--radius); background: var(--card); border: 1px solid var(--border); box-shadow: var(--shadow); backdrop-filter: blur(10px); }
      .header { display: flex; align-items: center; gap: 14px; margin-bottom: 24px; }
      .avatar { width: 56px; height: 56px; border-radius: 999px; object-fit: cover; border: 1px solid var(--border); }
      .title { font-size: 1.35rem; margin: 0; letter-spacing: 0.02em; }
      .subtitle { margin: 4px 0 0; color: var(--muted); font-size: 0.95rem; }
      
      .category-section { margin-bottom: 24px; }
      .category-title { font-size: 1.05rem; margin: 0 0 12px 4px; color: var(--text); border-left: 3px solid rgba(90, 213, 215, 0.8); padding-left: 8px; }
      .links { display: grid; gap: 10px; }
      
      .link-btn { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 14px; border-radius: 14px; text-decoration: none; color: var(--text); border: 1px solid var(--border); background: rgba(255, 255, 255, 0.06); transition: transform 120ms ease, background 120ms ease, border-color 120ms ease; }
      .link-btn:hover { transform: translateY(-1px); background: rgba(255, 255, 255, 0.10); border-color: rgba(255, 255, 255, 0.22); }
      .link-btn:active { transform: translateY(0px); }
      .link-left { display: inline-flex; align-items: center; gap: 10px; min-width: 0; }
      .badge { width: 34px; height: 34px; border-radius: 12px; display: grid; place-items: center; background: rgba(90, 213, 215, 0.16); border: 1px solid rgba(90, 213, 215, 0.22); flex-shrink: 0; }
      .link-text { display: grid; gap: 2px; min-width: 0; }
      .link-title { font-weight: 650; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .link-url { color: var(--muted); font-size: 0.86rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .arrow { opacity: 0.75; flex-shrink: 0; }
      .footer { margin-top: 14px; color: var(--muted); text-align: center; }
    </style>
  </head>
  <body>
    <main class="wrap">
      <section class="card">
        <header class="header">
          <img class="avatar" src="../assets/avatar.jpg" alt="アイコン" />
          <div class="title-area">
            <h1 class="title">Tools</h1>
            <p class="subtitle">自作ツールのリンク集</p>
          </div>
        </header>

        <div id="link-container" aria-label="リンク一覧">
          <!-- JSでカテゴリとリンクボタン生成 -->
        </div>

        <footer class="footer">
          <small>© <span id="year"></span> Kotarou Yamazumi</small>
        </footer>
      </section>
    </main>

    <!-- ========================================== -->
    <!-- 描画スクリプト -->
    <!-- ========================================== -->
    <script>
      function createLinkButton({ title, url, comment, icon }) {
        const a = document.createElement("a");
        a.className = "link-btn";
        a.href = url;
        a.target = "_blank";
        a.rel = "noopener noreferrer";

        a.innerHTML = `
          <span class="link-left">
            <span class="badge" aria-hidden="true">${icon ?? "🔗"}</span>
            <span class="link-text">
              <span class="link-title">${title ?? "Link"}</span>
              ${comment ? `<span class="link-url">${comment}</span>` : ""}
            </span>
          </span>
          <span class="arrow" aria-hidden="true">→</span>
        `;
        return a;
      }

      function renderLinks() {
        const container = document.getElementById("link-container");
        if (!container) return;
        
        container.innerHTML = ""; // 初期化
        
        categorizedLinks.forEach(categoryData => {
          // カテゴリごとのラッパー
          const section = document.createElement("div");
          section.className = "category-section";
          
          // カテゴリ見出し
          const h2 = document.createElement("h2");
          h2.className = "category-title";
          h2.textContent = categoryData.category;
          section.appendChild(h2);
          
          // リンクのグリッド
          const linksGrid = document.createElement("div");
          linksGrid.className = "links";
          
          categoryData.items.forEach(link => {
            linksGrid.appendChild(createLinkButton(link));
          });
          
          section.appendChild(linksGrid);
          container.appendChild(section);
        });
      }

      document.addEventListener("DOMContentLoaded", () => {
        renderLinks();
        document.getElementById("year").textContent = String(new Date().getFullYear());
      });
    </script>
  </body>
</html>
