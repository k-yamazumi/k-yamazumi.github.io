  <!-- 画面のスリープ制御と設定モーダル -->
  <script>
    // 設定モーダルの開閉
    const settingsOverlay = document.getElementById('settings-modal-overlay');
    document.getElementById('btn-settings').addEventListener('click', () => {
      settingsOverlay.style.display = 'flex';
    });
    document.getElementById('btn-settings-cancel').addEventListener('click', () => {
      settingsOverlay.style.display = 'none';
    });

    // Wake Lock API の手動制御
    let wakeLock = null;
    let isManualRelease = false;
    const btnToggleWakeLock = document.getElementById('btn-toggle-wakelock');

    const enableWakeLock = async () => {
      try {
        if ('wakeLock' in navigator) {
          wakeLock = await navigator.wakeLock.request('screen');
          isManualRelease = false;
          
          btnToggleWakeLock.innerText = '画面スリープ (ON)';
          btnToggleWakeLock.style.background = '#dc3545'; // ON時は赤色で強調
          
          // OS側で強制解放された場合のUIリセット処理
          wakeLock.addEventListener('release', () => {
            if (!isManualRelease) resetWakeLockUI();
          });
        } else {
          alert('お使いのブラウザは画面スリープ制御に対応していません');
        }
      } catch (err) {
        console.error('Wake Lock error:', err);
      }
    };

    const disableWakeLock = async () => {
      if (wakeLock !== null) {
        isManualRelease = true;
        await wakeLock.release();
        resetWakeLockUI();
      }
    };

    const resetWakeLockUI = () => {
      wakeLock = null;
      btnToggleWakeLock.innerText = '画面スリープ (OFF)';
      btnToggleWakeLock.style.background = '#343a40'; // OFF時はグレー
    };

    btnToggleWakeLock.addEventListener('click', () => {
      if (wakeLock === null) {
        enableWakeLock();
      } else {
        disableWakeLock();
      }
    });

    // バックグラウンド復帰時の再ロック処理 (ON設定時のみ)
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible' && wakeLock === null && !isManualRelease && btnToggleWakeLock.innerText.includes('ON')) {
        enableWakeLock();
      }
    });
  </script>

      { name: "札幌競馬場", lat: 43.07737615858754, lng: 141.32664443588544 },
      { name: "ススキノ", lat: 43.055462397124586, lng: 141.3535838999493 },
      { name: "中島公園", lat: 43.044479593447605, lng: 141.35443886556286 },
      { name: "札幌西高", lat: 43.063064499855464, lng: 141.3000743216789 },

    });
    
    // --- マップ変更用ロジック ---
    const mapModalOverlay = document.getElementById('map-modal-overlay');
    const mapListModalOverlay = document.getElementById('map-list-modal-overlay');
    const mapListContainer = document.getElementById('map-list-container');
    const fileInput = document.getElementById('file-input');

    document.getElementById('btn-change-map').addEventListener('click', () => {
      mapModalOverlay.style.display = 'flex';
    });
    document.getElementById('btn-map-cancel').addEventListener('click', () => {

    document.getElementById('btn-map-file').addEventListener('click', () => {
      mapModalOverlay.style.display = 'none';
      fileInput.click();
    });
    document.getElementById('btn-map-list').addEventListener('click', () => {
      mapModalOverlay.style.display = 'none';
      mapListModalOverlay.style.display = 'flex';
    });
    document.getElementById('btn-map-list-cancel').addEventListener('click', () => {
      mapListModalOverlay.style.display = 'none';
    });

    const mapFiles = [
      // kmlフォルダに入っているファイル名（拡張子なし）をここに追加
      "北海道マラソン","東京マラソン"
    ];

    const tileLayers = {
      osm: L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '&copy; OpenStreetMap' }),
      gsi_photo: L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/seamlessphoto/{z}/{x}/{y}.jpg', { attribution: '国土地理院' })
    };

    mapFiles.forEach(filename => {
      const btn = document.createElement('button');
      btn.className = 'modal-btn';
      btn.style.background = '#007bff';
      btn.innerText = filename;
      btn.onclick = () => {
        mapListModalOverlay.style.display = 'none';
        // 日本語ファイル名エラーを防ぐためエンコードし、相対パス(./)を明示
        loadKmlFromUrl(`./kml/${encodeURIComponent(filename)}.kml`);
      };
      mapListContainer.appendChild(btn);
    });

    function loadKmlFromUrl(url) {
      showToast('マップを読み込んでいます...');
      fetch(url)
        .then(response => {
          if (!response.ok) throw new Error('Network response was not ok');
          return response.text();
        })
        .then(kmlString => {
          parseKml(kmlString);
          showToast('マップを読み込みました');
        })
        .catch(error => {
          console.error('KML fetch error:', error);
          showToast('マップの読み込みに失敗しました(ファイルが存在しないか、CORSエラーの可能性があります)');
        });
    }
    // --------------------------------
    
    function initMap() {
      map = L.map('map', { zoomControl: false }).setView([43.060, 141.353], 12);
      
      currentTileLayer = tileLayers['osm'];
      currentTileLayer.addTo(map);
      
      L.control.zoom({ position: 'topright' }).addTo(map);
      
      map.on('click', function(e) {
        if (isMapSelectMode) {
          isGpsMode = false;
          setReceiverPosition(e.latlng.lat, e.latlng.lng);
          isMapSelectMode = false;
          document.getElementById('map').style.cursor = '';
          showToast('受信地点を設定しました');
        }
      });
      
      loadDefaultKml();
      initLandmarks();
      
      // 1秒待ってからFirebase連携を開始 (ESモジュールの読み込みを待つため)
      setTimeout(initFirebaseSync, 1000);
    }
    
    // --- Firebase同期処理 ---
    function initFirebaseSync() {
      if (window.onFirebaseValue && window.locationsRef) {
        window.onFirebaseValue(window.locationsRef, (snapshot) => {
          const fetchedUsers = snapshot.val() || {};
          const currentSelected = userSelect.value;
          
          // 選択中のユーザーがFirebaseから消えた場合でも、最後に取得したデータを維持する
          if (currentSelected !== 'manual' && !fetchedUsers[currentSelected] && window.lastSelectedUserData) {
            fetchedUsers[currentSelected] = window.lastSelectedUserData;
          }
          
          window.activeUsers = fetchedUsers;
          
          // 選択中ユーザーの最新データをキャッシュ
          if (currentSelected !== 'manual' && window.activeUsers[currentSelected]) {
            window.lastSelectedUserData = window.activeUsers[currentSelected];
          }

          updateDropdown();
          if (userSelect.value !== 'manual') {
            updateTargetMarker();
          }
        });
      }
      
      // 1分以上更新がないかチェックするタイマー
      staleCheckInterval = setInterval(checkStaleData, 5000);
    }

    function updateDropdown() {
      const currentSelected = userSelect.value;
      userSelect.innerHTML = '<option value="manual">手動設定</option>';
      
      for (const [id, data] of Object.entries(window.activeUsers)) {
        const option = document.createElement('option');
        option.value = id;
        option.text = data.name || "名称未設定";
        userSelect.appendChild(option);
        
        if (id === currentSelected) {
          option.selected = true;
        }
      }
    }

    userSelect.addEventListener('change', () => {
      const selectedId = userSelect.value;
      if (selectedId === 'manual') {
        window.lastSelectedUserData = null; // キャッシュクリア
        // 手動設定に戻す
        sliderContainer.style.display = 'block';
        targetInfo.style.display = 'none';
        targetInfo.innerText = '';
        targetInfo.classList.remove('stale-data');
        if (targetLiveMarker) {
          map.removeLayer(targetLiveMarker);
          targetLiveMarker = null;
        }
        if (runnerMarker) {
          runnerMarker.setOpacity(1); // 絵文字マーカーを再表示
        }
        updateBearingAndLine(); // 線の結び直し
      } else {
        window.lastSelectedUserData = window.activeUsers[selectedId]; // キャッシュセット
        // ユーザー自動追従モード
        sliderContainer.style.display = 'none';
        targetInfo.style.display = 'block';
        if (runnerMarker) {
          runnerMarker.setOpacity(0); // 絵文字マーカーを隠す
        }
        updateTargetMarker(true);
      }
    });

    function updateTargetMarker(panMap = false) {
      const selectedId = userSelect.value;
      if (selectedId === 'manual') return;
      
      const data = window.activeUsers[selectedId];
      if (!data) return;

      updateStaleText(data.timestamp);

      const latlng = [data.lat, data.lng];
      if (!targetLiveMarker) {
        const icon = L.divIcon({
          className: '',
          html: `<div class="target-live-marker"></div>`,
          iconSize: [14, 14],
          iconAnchor: [7, 7]
        });
        targetLiveMarker = L.marker(latlng, { icon: icon, zIndexOffset: 850 }).addTo(map);
      } else {
        targetLiveMarker.setLatLng(latlng);
        // 緑丸が表示されていない（古くて消えていた）場合は再表示
        if (!map.hasLayer(targetLiveMarker)) {
            targetLiveMarker.addTo(map);
        }
      }

      if (panMap) {
        map.panTo(latlng);
      }
      
      updateBearingAndLine(); // 線を引き直す
    }
    
    function checkStaleData() {
        if (userSelect.value === 'manual') return;
        const selectedId = userSelect.value;
        const data = window.activeUsers[selectedId];
        if (data) {
            updateStaleText(data.timestamp);
        }
    }

    function updateStaleText(timestamp) {
      const now = Date.now();
      const diffMinutes = (now - timestamp) / (1000 * 60);
      
      const d = new Date(timestamp);
      const timeStr = `最終更新: ${d.getHours().toString().padStart(2,'0')}:${d.getMinutes().toString().padStart(2,'0')}:${d.getSeconds().toString().padStart(2,'0')}`;
      
      targetInfo.innerText = timeStr;
      
      if (diffMinutes >= 1) {
        targetInfo.classList.add('stale-data');
        if (targetLiveMarker && map.hasLayer(targetLiveMarker)) {
          map.removeLayer(targetLiveMarker); // 1分経過で緑丸を消す
        }
      } else {
        targetInfo.classList.remove('stale-data');
      }
    }

    function parseKml(kmlString) {
      const parser = new DOMParser();
      const kmlDoc = parser.parseFromString(kmlString, 'text/xml');
      const geojson = toGeoJSON.kml(kmlDoc);
      
      if (courseLayer) map.removeLayer(courseLayer);
      distanceMarkersLayer.clearLayers();
      
      let lineCoords = [];
      turf.geomEach(geojson, function (currentGeometry) {
        if (currentGeometry.type === 'LineString' && lineCoords.length === 0) {
          lineCoords = currentGeometry.coordinates;
        } else if (currentGeometry.type === 'MultiLineString' && lineCoords.length === 0) {
          lineCoords = currentGeometry.coordinates[0];
        }
      });
      
      if (lineCoords.length === 0) return;
      
      courseLineString = turf.lineString(lineCoords);
      courseLength = turf.length(courseLineString, {units: 'kilometers'});
      
      slider.disabled = false;
      slider.max = courseLength.toFixed(2);
      slider.value = 0;
      
      const latlngs = lineCoords.map(coord => [coord[1], coord[0]]);
      courseLayer = L.polyline(latlngs, {color: 'blue', weight: 5, opacity: 0.7}).addTo(map);
      map.fitBounds(courseLayer.getBounds());
      
      for (let d = 5; d <= courseLength; d += 5) {
        const p = turf.along(courseLineString, d, {units: 'kilometers'});
        const dPrev = Math.max(0, d - 0.01);
        const dNext = Math.min(courseLength, d + 0.01);
        const pPrev = turf.along(courseLineString, dPrev, {units: 'kilometers'});
        const pNext = turf.along(courseLineString, dNext, {units: 'kilometers'});
        const courseBearing = turf.bearing(pPrev, pNext);
        const forwardAngle = courseBearing - 90;
        const isAlt = (d / 5) % 2 === 0;
        const lineAngle = isAlt ? forwardAngle + 90 : forwardAngle - 90; 
        const lineLength = 30; 
        const lineStyle = `transform: rotate(${lineAngle}deg); width: ${lineLength}px;`;
        const rad = lineAngle * Math.PI / 180;
        const boxLeft = Math.cos(rad) * lineLength;
        const boxTop = Math.sin(rad) * lineLength;
        const transform = `transform: translate(calc(${boxLeft}px - 50%), calc(${boxTop}px - 50%));`;

        const mk = L.marker([p.geometry.coordinates[1], p.geometry.coordinates[0]], {
          icon: L.divIcon({
            className: '',
            html: `
              <div class="distance-container">
                <div class="distance-line" style="${lineStyle}"></div>
                <div class="distance-dot"></div>
                <div class="distance-box" style="${transform}">${d} km</div>
              </div>
            `,
            iconSize: [0, 0],
            iconAnchor: [0, 0]
          }),
          interactive: false
        });
        distanceMarkersLayer.addLayer(mk);
      }
      if (chkDistance.checked) distanceMarkersLayer.addTo(map);
      
      updateRunnerFromDistance(0);
    }

    function handleOrientation(event) {
      let alpha = null;
      if (event.webkitCompassHeading) {
        alpha = event.webkitCompassHeading;
      } else if (event.alpha !== null) {
        alpha = 360 - event.alpha; 
      }
      
      if (alpha !== null && isGpsMode) {
        rawDeviceHeading = alpha; // 生の数値を保持しておく
        updateReceiverIcon();
      }
    }

    function updateReceiverIcon() {
      if (!receiverMarker) return;
      const el = receiverMarker.getElement();
      if (el) {
        const container = el.querySelector('.receiver-arrow-container'); //[cite: 6]
        if (container) {
          // 目標となる角度を 0〜359 の範囲で算出
          let targetHeading = (rawDeviceHeading + compassOffset) % 360;
          if (targetHeading < 0) targetHeading += 360;

          // 現在表示している角度と目標角度の差分を計算
          let diff = targetHeading - (currentVisualRotation % 360);
          
          // 差分が -180 〜 +180 の最短距離になるように補正
          if (diff < -180) diff += 360;
          if (diff > 180) diff -= 360;

          // 実際の表示用角度に最短距離の差分を加算
          currentVisualRotation += diff;
          
          // 他の計算で deviceHeading を使っている場合のための保持
          deviceHeading = targetHeading; 

          container.style.transform = `rotate(${currentVisualRotation}deg)`; //[cite: 6]
          container.style.display = isGpsMode ? 'block' : 'none'; //[cite: 6]
        }
      }
    }

    // --- オフライン用データの保存（手動キャッシュ） ---
    document.getElementById('btn-save-cache').addEventListener('click', async () => {
      const res = confirm("地図やコースデータの保存には大きな通信量(約5〜15MB)が発生します。\nWi-Fi環境での実行を強く推奨します。\n\nオフライン用データの保存（または最新版への更新）を開始しますか？");
      if (!res) return;

      showToast('データのダウンロードを開始しています...');
      
      try {
        const cacheName = 'marathon-offline-data';
        // 既存のキャッシュを削除して完全更新
        await caches.delete(cacheName);
        const cache = await caches.open(cacheName);

        // 1. 静的ファイルとKMLのキャッシュ
        const kmlUrls = mapFiles.map(name => `./kml/${encodeURIComponent(name)}.kml`);
        const assets = [
          './',
          './marathon-rx.html',
          './style_marathon-rx.css',
          './icon_marathon-rx.png',
          './icon_marathon-rx_192.png',
          './manifest_marathon-rx.json',
          ...kmlUrls
        ];
        
        // no-corsやreloadを指定して確実に最新を取得
        for (const url of assets) {
          try {
            const req = new Request(url, { cache: 'reload' });
            const res = await fetch(req);
            if (res.ok) await cache.put(req, res);
          } catch (e) {
            console.warn('Asset fetch failed:', url);
          }
        }

        // 2. 現在選択されているコース範囲の地図タイルを計算して取得 (ズーム12〜15)
        if (currentTileLayer && (courseLayer || map)) {
          const bounds = courseLayer ? courseLayer.getBounds() : map.getBounds();
          const minLat = bounds.getSouth();
          const maxLat = bounds.getNorth();
          const minLng = bounds.getWest();
          const maxLng = bounds.getEast();
          
          const tileUrls = [];
          const urlTemplate = currentTileLayer._url;
          const subdomains = currentTileLayer.options.subdomains || 'abc';
          
          // 緯度経度からタイル座標を計算する関数
          const lon2tile = (lon, zoom) => Math.floor((lon + 180) / 360 * Math.pow(2, zoom));
          const lat2tile = (lat, zoom) => Math.floor((1 - Math.log(Math.tan(lat * Math.PI / 180) + 1 / Math.cos(lat * Math.PI / 180)) / Math.PI) / 2 * Math.pow(2, zoom));

          for (let z = 12; z <= 15; z++) {
            const xMin = lon2tile(minLng, z);
            const xMax = lon2tile(maxLng, z);
            const yMin = lat2tile(maxLat, z);
            const yMax = lat2tile(minLat, z);
            
            for (let x = xMin; x <= xMax; x++) {
              for (let y = yMin; y <= yMax; y++) {
                const s = subdomains[(x + y) % subdomains.length];
                const tileUrl = urlTemplate
                  .replace('{s}', s)
                  .replace('{z}', z)
                  .replace('{x}', x)
                  .replace('{y}', y)
                  .replace('{r}', ''); // Retina非対応タイルのためのフォールバック
                tileUrls.push(tileUrl);
              }
            }
          }

          // 並列リクエスト（50件ずつ）でブラウザの負荷を抑えながらタイルをキャッシュ
          const fetchTile = async (url) => {
            try {
              // 外部タイルのCORSブロックを防ぐため no-cors モードで取得（Opaqueレスポンスとして保存）
              const req = new Request(url, { mode: 'no-cors', cache: 'reload' });
              const response = await fetch(req);
              await cache.put(req, response);
            } catch (e) {}
          };

          for (let i = 0; i < tileUrls.length; i += 50) {
            const chunk = tileUrls.slice(i, i + 50);
            await Promise.all(chunk.map(fetchTile));
          }
        }
        showToast('オフライン用データの保存が完了しました！');
      } catch (error) {
        console.error('Offline caching error:', error);
        showToast('保存中にエラーが発生しました。');
      }
    });

    document.getElementById('btn-set-zero').addEventListener('click', () => {
      // 手動モードか自動追従モードかで対象マーカーを切り替え
      const target = userSelect.value === 'manual' ? runnerMarker : targetLiveMarker;
      
      if (!receiverMarker || !target) {
        showToast('受信点と対象ランナーが必要です');
        return;
      }
      
      const recLatlng = receiverMarker.getLatLng();
      const rLatlng = target.getLatLng();
      const recPoint = turf.point([recLatlng.lng, recLatlng.lat]);
      const runnerPoint = turf.point([rLatlng.lng, rLatlng.lat]);
      let b = turf.bearing(recPoint, runnerPoint);
      if (b < 0) b += 360;
      referenceBearing = b;
      updateBearingAndLine();
      showToast('現在の方向を0度に設定しました');
    });

    document.getElementById('btn-list-select').addEventListener('click', () => {
      modalOverlay.style.display = 'none';
      listModalOverlay.style.display = 'flex';
    });

    document.getElementById('btn-list-cancel').addEventListener('click', () => {
      listModalOverlay.style.display = 'none';
    });

    slider.addEventListener('input', () => {
      updateRunnerFromDistance(parseFloat(slider.value));
    });

    function updateRunnerFromDistance(dist) {
      distVal.innerText = dist.toFixed(2);
      if (!courseLineString) return;
      
      const runnerPoint = turf.along(courseLineString, dist, {units: 'kilometers'});
      const rLatlng = [runnerPoint.geometry.coordinates[1], runnerPoint.geometry.coordinates[0]];
      
      if (!runnerMarker) {
        const runnerIcon = L.divIcon({
          html: '<div style="font-size:28px; line-height:1; text-align:center; filter: drop-shadow(2px 2px 2px rgba(0,0,0,0.5)); cursor:grab;">🏃</div>',
          className: 'custom-runner-icon',
          iconSize: [30, 30],
          iconAnchor: [15, 15]
        });
        runnerMarker = L.marker(rLatlng, {icon: runnerIcon, draggable: true, zIndexOffset: 800}).addTo(map);
        
        runnerMarker.on('drag', function(e) {
          const pt = turf.point([e.latlng.lng, e.latlng.lat]);
          const snapped = turf.nearestPointOnLine(courseLineString, pt, {units: 'kilometers'});
          const newDist = snapped.properties.location;
          
          runnerMarker.setLatLng([snapped.geometry.coordinates[1], snapped.geometry.coordinates[0]]);
          slider.value = newDist;
          distVal.innerText = newDist.toFixed(2);
          updateBearingAndLine();
        });
      } else {
        runnerMarker.setLatLng(rLatlng);
      }
      
      if (userSelect.value === 'manual') {
        updateBearingAndLine();
      }
    }

    function updateBearingAndLine() {
      // 手動モードか自動追従モードかで対象マーカーを切り替え
      const target = userSelect.value === 'manual' ? runnerMarker : targetLiveMarker;
      
      if (!receiverMarker || !target) return;
      const recLatlng = receiverMarker.getLatLng();
      const rLatlng = target.getLatLng();
      
      const recPoint = turf.point([recLatlng.lng, recLatlng.lat]);
      const runnerPoint = turf.point([rLatlng.lng, rLatlng.lat]);
      
      let bearing = turf.bearing(recPoint, runnerPoint);
      if (bearing < 0) bearing += 360;
      
      let relBearing = bearing - referenceBearing;
      if (relBearing < 0) relBearing += 360;
      relBearing = relBearing % 360;
      
      if (relBearing > 180) {
        relBearing -= 360;
      }
      
      bearingVal.innerText = relBearing.toFixed(1);

      const destPoint = turf.destination(recPoint, 50, bearing);
      const destLatlng = [destPoint.geometry.coordinates[1], destPoint.geometry.coordinates[0]];
      
      if (!guideLine) {
        guideLine = L.polyline([recLatlng, destLatlng], {color: '#d9534f', weight: 4}).addTo(map);
      } else {
        guideLine.setLatLngs([recLatlng, destLatlng]);
      }
    }

    window.addEventListener('resize', () => {
      if (map) setTimeout(() => map.invalidateSize(), 100);
    });

    window.onload = initMap;
  </script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw_marathon-rx.js')
          .then(registration => {
            console.log('ServiceWorker 登録成功');
          })
          .catch(err => {
            console.log('ServiceWorker 登録失敗: ', err);
          });
      });
    }
  </script>
  
    <!-- 応急処置: モーダルをパネルの枠から強制脱出させてbody直下へ移動 -->
  <script>
    document.querySelectorAll('div[id$="-overlay"]').forEach(m => document.body.appendChild(m));
  </script>

</body>
