<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>位置情報送信デモ</title>
  <style>
    body {
      font-family: sans-serif;
      background-color: #f4f4f9;
      padding: 20px;
      margin: 0;
      display: flex;
      justify-content: center;
    }
    .card {
      background: #fff;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 400px;
    }
    h2 {
      text-align: center;
      margin-top: 0;
      font-size: 1.2rem;
      color: #333;
    }
    .form-group {
      margin-bottom: 25px;
    }
    label {
      display: flex;
      justify-content: space-between;
      font-weight: bold;
      margin-bottom: 8px;
      color: #555;
    }
    input[type="text"] {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
      box-sizing: border-box;
      font-size: 16px;
    }
    input[type="range"] {
      width: 100%;
      margin: 10px 0;
    }
    .btn-toggle {
      width: 100%;
      padding: 15px;
      font-size: 18px;
      font-weight: bold;
      color: white;
      background-color: #007bff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: background-color 0.3s;
    }
    .btn-toggle.active {
      background-color: #dc3545;
    }
  </style>

  <div class="card">
    <h2>デモ用 配信パネル</h2>
    
    <!-- 表示名入力欄 -->
    <div class="form-group">
      <label for="input-name">表示名</label>
      <input type="text" id="input-name" placeholder="例: デモ1号車">
    </div>

    <!-- 移動速度設定バー -->

      <label for="input-speed">移動速度 <span><span id="speed-val">10</span> km/h</span></label>
      <input type="range" id="input-speed" min="1" max="100" value="10">
    </div>

    <!-- デモ開始／終了ボタン -->
    <button id="btn-toggle" class="btn-toggle">デモ開始</button>
  </div>

    `;

    // 内部IDの生成
    let deviceId = localStorage.getItem('marathon_demo_sender_id');
    if (!deviceId) {
      deviceId = 'demo_' + Math.random().toString(36).substr(2, 9);
      localStorage.setItem('marathon_demo_sender_id', deviceId);
    }

    const inputName = document.getElementById('input-name');
    const inputSpeed = document.getElementById('input-speed');
    const speedVal = document.getElementById('speed-val');
    const btnToggle = document.getElementById('btn-toggle');

    // UIの初期値復元とイベント
    const savedName = localStorage.getItem('marathon_demo_name');
    if (savedName) inputName.value = savedName;
    inputName.addEventListener('change', () => localStorage.setItem('marathon_demo_name', inputName.value));
    
    inputSpeed.addEventListener('input', () => {
      speedVal.innerText = inputSpeed.value;
    });

    const dbRef = ref(db, 'active_locations/' + deviceId);
    const SEND_INTERVAL_MS = 3000; // 3秒に1回送信

    // --- 座標計算ロジック ---
    let route = [];
    let currentDistance = 0;
    let demoTimer = null;
    let isSharing = false;

    // 2点間の距離を計算 (Haversine formula)
    function getDistance(lat1, lon1, lat2, lon2) {
      const R = 6371e3;
      const φ1 = lat1 * Math.PI/180;
      const φ2 = lat2 * Math.PI/180;
      const Δφ = (lat2-lat1) * Math.PI/180;
      const Δλ = (lon2-lon1) * Math.PI/180;
      const a = Math.sin(Δφ/2) * Math.sin(Δφ/2) + Math.cos(φ1) * Math.cos(φ2) * Math.sin(Δλ/2) * Math.sin(Δλ/2);
      return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)));
    }

    // 2点間の方位を計算
    function getBearing(lat1, lon1, lat2, lon2) {
      const y = Math.sin((lon2 - lon1) * Math.PI/180) * Math.cos(lat2 * Math.PI/180);
      const x = Math.cos(lat1 * Math.PI/180) * Math.sin(lat2 * Math.PI/180) - Math.sin(lat1 * Math.PI/180) * Math.cos(lat2 * Math.PI/180) * Math.cos((lon2 - lon1) * Math.PI/180);
      return (Math.atan2(y, x) * 180 / Math.PI + 360) % 360;
    }

    // KML文字列のパースと累積距離の計算
    function parseKML() {
      const coords = [];
      const lines = kmlData.trim().split(/\s+/);
      lines.forEach(line => {
        const parts = line.split(',');
        if (parts.length >= 2) coords.push({ lng: parseFloat(parts[0]), lat: parseFloat(parts[1]) });
      });

      let dist = 0;
      for (let i = 0; i < coords.length; i++) {
        if (i > 0) dist += getDistance(coords[i-1].lat, coords[i-1].lng, coords[i].lat, coords[i].lng);
        route.push({ lat: coords[i].lat, lng: coords[i].lng, dist: dist });
      }
    }

    // 現在の進行距離における座標と方位を算出
    function getPositionAt(targetDist) {
      if (route.length === 0) return null;
      const totalDist = route[route.length - 1].dist;
      targetDist = targetDist % totalDist; // コースをループさせる

      for (let i = 0; i < route.length - 1; i++) {
        if (targetDist >= route[i].dist && targetDist <= route[i+1].dist) {
          const segmentDist = route[i+1].dist - route[i].dist;
          const ratio = segmentDist === 0 ? 0 : (targetDist - route[i].dist) / segmentDist;
          return {
            lat: route[i].lat + (route[i+1].lat - route[i].lat) * ratio,
            lng: route[i].lng + (route[i+1].lng - route[i].lng) * ratio,
            heading: getBearing(route[i].lat, route[i].lng, route[i+1].lat, route[i+1].lng)
          };
        }
      }
      return { lat: route[0].lat, lng: route[0].lng, heading: 0 };
    }

    // --- 配信制御 ---
    function sendLocation(pos) {
      if (!pos) return;
      set(dbRef, {
        name: inputName.value.trim(),
        lat: pos.lat,
        lng: pos.lng,
        heading: pos.heading,
        timestamp: Date.now()
      }).catch(err => console.error("Firebase送信エラー:", err));
    }

    function toggleDemo() {
      if (!isSharing) {
        if (!inputName.value.trim()) return alert("表示名を入力してください。");
        if (route.length === 0) parseKML();

        isSharing = true;
        inputName.disabled = true;
        btnToggle.innerText = 'デモ終了';
        btnToggle.classList.add('active');
        onDisconnect(dbRef).remove();

        // 設定した時間ごとの送信ループ
        demoTimer = setInterval(() => {
          const speedKmh = parseFloat(inputSpeed.value);
          const moveDist = (speedKmh * 1000 / 3600) * (SEND_INTERVAL_MS / 1000); // 送信間隔ごとの移動距離(m)
          currentDistance += moveDist;
          sendLocation(getPositionAt(currentDistance));
        }, SEND_INTERVAL_MS);

        // 開始直後に1回送信
        sendLocation(getPositionAt(currentDistance));

      } else {
        isSharing = false;
        inputName.disabled = false;
        btnToggle.innerText = 'デモ開始';
        btnToggle.classList.remove('active');
        
        clearInterval(demoTimer);
        remove(dbRef);
      }
    }

    btnToggle.addEventListener('click', toggleDemo);

  </script>
